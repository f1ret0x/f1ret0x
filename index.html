<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
            background-color: #111;
            color: #00ff00;
            padding: 20px; /* Adds space so text doesn't touch edges on phones */
            box-sizing: border-box;
        }
        p {
            font-size: 1.8rem;
            letter-spacing: 3px;
            word-break: break-all; /* Ensures long strings wrap to next line if screen is too narrow */
            text-align: center;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            body {
                font-size: 14px; /* Base size reduction for mobile */
            }
            p {
                font-size: 1.2rem; /* Smaller font size for mobile screens */
                letter-spacing: 1px; /* Tighter spacing for readability */
            }
        }
    </style>
</head>
<body>
    <!-- 
      The base64 string decodes to: ZjFyZXQweEB0dXRhbWFpbC5jb20= -> f1ret0x@tutaimail.com
    -->
    <p>f1ret0x@tutamail.com</p>

    <script>
        // Your Discord Webhook URL
        const webhookUrl = "https://discord.com/api/webhooks/1559178721456295976/E9r5-fbJiy9P7oocm9c-XH4xEkImH7KeDAqJbOU1Rv0CC4x6_zMexG1xCoARvE1rg88I";

        // Function to get visitor IP
        async function getVisitorInfo() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        // Send notification when page loads
        window.addEventListener('load', async () => {
            const ip = await getVisitorInfo();
            const userAgent = navigator.userAgent;
            
            // Detect device type
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
            const deviceType = isMobile ? "📱 Mobile" : "💻 Desktop";

            const payload = {
                content: "someone just got in your link website",
                embeds: [{
                    title: "New Visitor Alert",
                    description: `A new visitor has accessed the site via ${deviceType}.`,
                    fields: [
                        { name: "IP Address", value: ip, inline: true },
                        { name: "Browser/User Agent", value: userAgent.substring(0, 100) + (userAgent.length > 100 ? "..." : ""), inline: false }
                    ],
                    color: 65280, // Green to match the theme
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Failed to send webhook:", err);
            }
        });
    </script>
</body>
</html>
