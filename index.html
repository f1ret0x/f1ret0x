<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        body {
            font-family: monospace;
            background-color: #111;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #login-screen, #chat-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #login-screen {
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #chat-screen {
            display: none;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 10px;
            background: #050505;
        }
        .message {
            margin-bottom: 10px;
            word-break: break-word;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .message.admin-msg {
            color: #ff5555;
        }
        input, button {
            background: #222;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 1rem;
        }
        button {
            cursor: pointer;
            background: #00ff00;
            color: #000;
            font-weight: bold;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex: 1;
        }
        .delete-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 2px 6px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <h2>Enter Chat Room</h2>
        <input type="text" id="username-input" placeholder="Username (e.g. f1ret0x)">
        <input type="password" id="password-input" placeholder="Password (if admin)">
        <button onclick="joinChat()">Join</button>
        <p id="error-msg" style="color: #ff4444;"></p>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <div id="chat-container"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const webhookUrl = "YOUR_DISCORD_WEBHOOK_URL_HERE";
        let currentUser = "";
        let isAdmin = false;
        const ADMIN_PASSWORD = "YOUR_SECRET_PASSWORD"; // Set your admin password here

        // Send Discord notification when page loads
        window.addEventListener('load', async () => {
            if (!webhookUrl || webhookUrl.includes("https://discord.com/api/webhooks/1559178718981914744/eTKjUJ7cMyihL29Fp_bAQG3RbyGrqd1MzYYccuYu07EvEcqc_w53oB7oVqKnp7ovHB-v")) return;
            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: "🔔 someone just got in your link website" })
                });
            } catch (err) {
                console.error("Failed to send webhook:", err);
            }
        });

        function joinChat() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (!username) return;

            if (username === 'f1ret0x') {
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                } else {
                    errorMsg.textContent = "Incorrect password for f1ret0x.";
                    return;
                }
            }

            currentUser = username;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            loadMessages();
        }

        function loadMessages() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const messages = JSON.parse(localStorage.getItem('chat_messages') || '[]');

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.isAdmin ? 'admin-msg' : ''}`;
                div.id = `msg-${msg.id}`;

                let deleteButtonHtml = '';
                if (isAdmin) {
                    deleteButtonHtml = `<button class="delete-btn" onclick="deleteMessage('${msg.id}')">Delete</button>`;
                }

                div.innerHTML = `
                    <span><strong>[${msg.timestamp}] ${msg.username}:</strong> ${escapeHtml(msg.text)}</span>
                    ${deleteButtonHtml}
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const messages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
            const newMsg = {
                id: Date.now().toString(),
                username: currentUser,
                text: text,
                isAdmin: isAdmin,
                timestamp: new Date().toLocaleTimeString()
            };

            messages.push(newMsg);
            localStorage.setItem('chat_messages', JSON.stringify(messages));
            input.value = '';
            loadMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function deleteMessage(messageId) {
            if (!isAdmin) return;
            let messages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
            messages = messages.filter(msg => msg.id !== messageId);
            localStorage.setItem('chat_messages', JSON.stringify(messages));
            loadMessages();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
